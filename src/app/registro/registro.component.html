<div class="container-fluid px-3">
  <div class="table-wrapper">
    <table class="table table-striped table-sm text-center w-100">
      <thead class="table-header-sticky">
        <tr>
          <th colspan="4" class="titulo-registro">REGISTRO</th>
        </tr>
        <tr>
          <th>Invitado</th>
          <th>Num. Personas</th>
          <th>Descripción</th>
          <th>Confirmación</th>
        </tr>
      </thead>

      <tbody class="table-body-scroll">
        <tr *ngFor="let fila of resultQuery">
          <td>{{ fila.nombre }}</td>
          <td>{{ fila.invConfirmados }}</td>
          <td>{{ fila.descripcion }}</td>
          <td>
            <img *ngIf="fila.confAsistencia" width="30" height="30"
              src="https://img.icons8.com/emoji/48/check-mark-emoji.png" alt="check-mark-emoji" />
            <img *ngIf="!fila.confAsistencia" width="30" height="30"
              src="https://img.icons8.com/ios-glyphs/30/minus-math.png" alt="minus-math" />
          </td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <td colspan="3" class="text-end">Total de Personas Confirmadas:</td>
          <td>
            <input type="number" class="form-control" [value]="totalConfirmados" readonly />
          </td>
        </tr>
        <tr>
          <td colspan="4" class="text-end">
            <button *ngIf="showButton" class="btn btn-primary me-md-2" type="button"
              (click)="generarPDF()">Descargar PDF</button>
          </td>
        </tr>
      </tfoot>
    </table>
  </div>
</div>
